# Compiles smolcord on a macOS runner.
#
# This exists because the project was written without a Mac. Everything in
# Sources/ is unverified until this runs: UIKit, Network.framework and the zlib
# bridging header cannot be typechecked on Linux.
#
# It does not sign or ship anything. CODE_SIGNING_ALLOWED=NO because the goal
# is "does it compile", and signing needs a team id and secrets.

name: ios-build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    # No macOS minutes needed for these, so run them first and cheaply.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: transport tests
        run: python3 -I Tests/test_gwlib.py
      - name: verdict tests
        run: python3 -I Tests/test_verdict.py

  swift-core:
    # The portable subset, on Linux. Catches wire-format and accounting
    # regressions without spending macOS minutes.
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      - name: swift version
        run: swift --version
      - name: portable tests
        run: swift test

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true

      - name: install xcodegen
        run: brew install xcodegen

      - name: generate project
        run: xcodegen generate

      # The real check. An iOS 12 deployment target is below what Xcode 16+
      # officially supports, so expect a warning about it. A warning is not a
      # failure here; the App Store path is closed for iOS 12 anyway and this
      # app sideloads.
      - name: build for device
        run: |
          set -o pipefail
          xcodebuild \
            -scheme smolcord \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      # Pick whatever iPhone simulator the runner actually has. Hard-coding a
      # device name breaks whenever GitHub changes the image.
      #
      # One line on purpose: an embedded multi-line script inside a YAML block
      # scalar is how the first push failed. A line at column zero terminates
      # the scalar, and the whole workflow stops parsing.
      - name: choose a simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.isAvailable == true) | .name' | grep -m1 iPhone || true)
          name=${name:-iPhone 16}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "using simulator: $name"

      - name: unit tests on the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -scheme smolcord \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: summarise warnings
        if: always()
        run: |
          echo "### build warnings" >> "$GITHUB_STEP_SUMMARY"
          grep -E "warning:" build.log | sort -u | head -40 >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
